<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fold Posture Styling</title>
<style>
/* =========================================================
   1. 状態の判定（1 状態 = 1 ブロック、互いに排他）
   ---------------------------------------------------------
   各ブロックの条件は、同じメディア特性の異なる値で区切っているので
   同時に 2 つ以上が真になることはない。順序に依存しない。

     セグメント数   姿勢         向き        → 状態
     ----------------------------------------------------------
     1×1           continuous   画面が縦    → １セグメント縦
     1×1           continuous   画面が横    → １セグメント横
     1×1           folded       （不問）    → テーブルトップ（※）
     横に 2        continuous   （不問）    → ２セグメント縦平板（縦ヒンジ）
     横に 2        folded       （不問）    → 本開き
     縦に 2        continuous   （不問）    → ２セグメント横平板（横ヒンジ）
     縦に 2        folded       （不問）    → テーブルトップ

   ※ 1 枚画面の折りたたみ端末をテーブルトップにすると、OS がパネルを
     下半分に出す（Samsung Flex モード等）ため Chrome には上半分だけが
     渡り、セグメントは 1×1 になる。半開きでセグメントが 1 になるのは
     この姿勢だけなので、1×1 かつ folded をテーブルトップとみなす。
     本開きはセグメント 2 で報告されるので衝突しない。

   縦 / 横 … 1 セグメント時は画面の向き、2 セグメント時はヒンジの向き
   画面の向きは orientation ではなく device-aspect-ratio で判定する。
   orientation はビューポートの縦横比で決まるため、ほぼ正方形の内側画面では
   ツールバー分だけ高さが減って縦持ちでも landscape になる。
   device-aspect-ratio は画面そのものの縦横比で、Android では持ち方に合わせて回転する。
     縦ヒンジ = 左右 2 セグメント = horizontal-viewport-segments: 2
     横ヒンジ = 上下 2 セグメント = vertical-viewport-segments: 2
   どのブロックにも当たらない場合（メディア特性 非対応など）は
   :root の既定値のまま「該当なし」と表示する。
   ========================================================= */
:root {
  --label: "該当なし";
  --accent: #6b7280;
  --accent-soft: #e5e7eb;
  --cols: 1fr;
  --rows: 100dvh 100dvh;
  --col-gap: 0px;
  --row-gap: 0px;
}

/* １セグメント縦: 各パネル = ビューポート 1 枚分、縦に積んでスクロール */
@media (horizontal-viewport-segments: 1) and (vertical-viewport-segments: 1) and (device-posture: continuous) and (device-aspect-ratio <= 1/1) {
  :root {
    --label: "１セグメント縦";
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --cols: 1fr;
    --rows: 100dvh 100dvh;
    --col-gap: 0px;
    --row-gap: 0px;
  }
}

/* １セグメント横: 同上 */
@media (horizontal-viewport-segments: 1) and (vertical-viewport-segments: 1) and (device-posture: continuous) and (device-aspect-ratio > 1/1) {
  :root {
    --label: "１セグメント横";
    --accent: #0891b2;
    --accent-soft: #cffafe;
    --cols: 1fr;
    --rows: 100dvh 100dvh;
    --col-gap: 0px;
    --row-gap: 0px;
  }
}

/* テーブルトップ（1×1 形）: ビューポート全体が上段にあたるので、配置は 1 セグメントと同じ */
@media (horizontal-viewport-segments: 1) and (vertical-viewport-segments: 1) and (device-posture: folded) {
  :root {
    --label: "テーブルトップ";
    --accent: #dc2626;
    --accent-soft: #fee2e2;
    --cols: 1fr;
    --rows: 100dvh 100dvh;
    --col-gap: 0px;
    --row-gap: 0px;
  }
  .secondary { background: #1f2937; }
}

/* ２セグメント縦平板: 左右のセグメント実寸に各パネルを合わせ、ヒンジ幅を空ける */
@media (horizontal-viewport-segments: 2) and (device-posture: continuous) {
  :root {
    --label: "２セグメント縦平板";
    --accent: #7c3aed;
    --accent-soft: #ede9fe;
    --cols: env(viewport-segment-width 0 0) env(viewport-segment-width 1 0);
    --rows: 100dvh;
    --col-gap: calc(env(viewport-segment-left 1 0) - env(viewport-segment-right 0 0));
    --row-gap: 0px;
  }
  html, body { height: 100dvh; overflow: hidden; }
}

/* 本開き: 配置は縦平板と同じ。左ページ = サブ、右ページ = メイン */
@media (horizontal-viewport-segments: 2) and (device-posture: folded) {
  :root {
    --label: "本開き";
    --accent: #b45309;
    --accent-soft: #fef3c7;
    --cols: env(viewport-segment-width 0 0) env(viewport-segment-width 1 0);
    --rows: 100dvh;
    --col-gap: calc(env(viewport-segment-left 1 0) - env(viewport-segment-right 0 0));
    --row-gap: 0px;
  }
  html, body { height: 100dvh; overflow: hidden; }
  .secondary { order: -1; }
}

/* ２セグメント横平板: 上下のセグメント実寸に各パネルを合わせ、ヒンジ高を空ける */
@media (vertical-viewport-segments: 2) and (device-posture: continuous) {
  :root {
    --label: "２セグメント横平板";
    --accent: #059669;
    --accent-soft: #d1fae5;
    --cols: 1fr;
    --rows: env(viewport-segment-height 0 0) env(viewport-segment-height 0 1);
    --col-gap: 0px;
    --row-gap: calc(env(viewport-segment-top 0 1) - env(viewport-segment-bottom 0 0));
  }
  html, body { height: 100dvh; overflow: hidden; }
}

/* テーブルトップ（2 セグメント形）: 配置は横平板と同じ。下段 = サブを暗色に */
@media (vertical-viewport-segments: 2) and (device-posture: folded) {
  :root {
    --label: "テーブルトップ";
    --accent: #dc2626;
    --accent-soft: #fee2e2;
    --cols: 1fr;
    --rows: env(viewport-segment-height 0 0) env(viewport-segment-height 0 1);
    --col-gap: 0px;
    --row-gap: calc(env(viewport-segment-top 0 1) - env(viewport-segment-bottom 0 0));
  }
  html, body { height: 100dvh; overflow: hidden; }
  .secondary { background: #1f2937; }
}

/* =========================================================
   2. パネル配置（--cols / --rows / gap は状態ブロックが決める）
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-snap-type: y mandatory; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
  color: #111827;
  background: var(--accent-soft);
  transition: background-color .3s;
}
.stage {
  display: grid;
  grid-template-columns: var(--cols);
  grid-template-rows: var(--rows);
  column-gap: var(--col-gap);
  row-gap: var(--row-gap);
}
.panel {
  min-width: 0; min-height: 0; overflow: auto;
  scroll-snap-align: start;
  background: #fff; padding: 16px;
}

/* =========================================================
   3. パネル内コンテンツの向き（画面の向きに連動）
   ---------------------------------------------------------
   縦持ち: h1 は縦書き、カードは 1 列
   横持ち: h1 は横書き、カードは 2 列
   ========================================================= */
.primary { display: grid; place-items: center; }
.primary h1 { margin: 0; font-size: clamp(1.5rem, 6vmin, 3rem); color: var(--accent); }
.primary h1::before { content: var(--label); }
.secondary { display: grid; gap: 8px; align-content: start; }

@media (device-aspect-ratio <= 1/1) {
  .primary h1 { writing-mode: vertical-rl; }
  .secondary { grid-template-columns: 1fr; }
}
@media (device-aspect-ratio > 1/1) {
  .primary h1 { writing-mode: horizontal-tb; }
  .secondary { grid-template-columns: 1fr 1fr; }
}

/* =========================================================
   4. サブパネルのカード（非マッチは無効表記）
   ---------------------------------------------------------
   .q はマッチ判定だけを持つラッパー（--on）。
   見た目は中の .card が style() コンテナクエリで --on を参照して決める。
   ========================================================= */
.q { display: grid; }
.card {
  display: flex; justify-content: space-between; gap: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem;
  padding: 10px 12px; border: 2px solid #d1d5db; border-radius: 8px;
  background: #f3f4f6; color: #9ca3af; text-decoration: line-through;
}
.card::after { content: "無効"; font-weight: 700; flex-shrink: 0; }

@media (orientation: portrait)           { .q-portrait  { --on: 1; } }
@media (orientation: landscape)          { .q-landscape { --on: 1; } }
@media (device-aspect-ratio <= 1/1)      { .q-dar-p     { --on: 1; } }
@media (device-aspect-ratio > 1/1)       { .q-dar-l     { --on: 1; } }
@media (horizontal-viewport-segments: 1) { .q-h1        { --on: 1; } }
@media (horizontal-viewport-segments: 2) { .q-h2        { --on: 1; } }
@media (vertical-viewport-segments: 1)   { .q-v1        { --on: 1; } }
@media (vertical-viewport-segments: 2)   { .q-v2        { --on: 1; } }
@media (device-posture: continuous)      { .q-cont      { --on: 1; } }
@media (device-posture: folded)          { .q-fold      { --on: 1; } }

@container style(--on: 1) {
  .card {
    border-color: var(--accent); background: var(--accent-soft);
    color: #111827; text-decoration: none;
  }
  .card::after { content: "有効"; color: var(--accent); }
}
</style>
</head>
<body>
<main class="stage">
  <section class="panel primary"><h1></h1></section>
  <aside class="panel secondary">
    <div class="q q-portrait"><div class="card">(orientation: portrait)</div></div>
    <div class="q q-landscape"><div class="card">(orientation: landscape)</div></div>
    <div class="q q-dar-p"><div class="card">(device-aspect-ratio <= 1/1)</div></div>
    <div class="q q-dar-l"><div class="card">(device-aspect-ratio > 1/1)</div></div>
    <div class="q q-h1"><div class="card">(horizontal-viewport-segments: 1)</div></div>
    <div class="q q-h2"><div class="card">(horizontal-viewport-segments: 2)</div></div>
    <div class="q q-v1"><div class="card">(vertical-viewport-segments: 1)</div></div>
    <div class="q q-v2"><div class="card">(vertical-viewport-segments: 2)</div></div>
    <div class="q q-cont"><div class="card">(device-posture: continuous)</div></div>
    <div class="q q-fold"><div class="card">(device-posture: folded)</div></div>
  </aside>
</main>
</body>
</html>
